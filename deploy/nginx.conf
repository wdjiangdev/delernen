events {}
http {
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }
  default_type application/octet-stream;
  sendfile on;
  etag on;
  gzip on;
  gzip_types application/javascript application/json application/manifest+json text/css;
  server {
    listen 127.0.0.1:18095;
    root /usr/share/nginx/delernen;
    index index.html;
    # 目录地址少了结尾斜杠（/kurs → /kurs/）时，301 用相对地址 Location: /kurs/。
    # 否则 nginx 会拼出 http://域名:18095/kurs/（内部端口 + http），经 Cloudflare 隧道打不开。
    absolute_redirect off;
    port_in_redirect off;
    # 所有 .html（含 index.html、Alice 子页面）每次校验（no-cache 仍可 304），避免 iOS 等客户端拿到旧页面
    # 注意：目录式 URL（如 /memorize/）经 index 指令直接 serve，不命中这条正则，需下面单独处理
    location ~ \.html$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location ~ /$ { add_header Cache-Control "no-cache" always; try_files $uri $uri/ =404; }
    # js/json 经常更新：no-cache = 每次用 ETag 向服务器校验，没变就 304，不重复下载
    location ~ \.(js|json)$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
